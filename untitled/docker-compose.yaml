  services:
    mysql:
      image: mysql:9.7.2
      environment:
        MYSQL_ROOT_PASSWORD:
        MYSQL_DATABASE:
        MYSQL_USER:
        MYSQL_PASSWORD:
      ports:
        - "3307:3306"
      volumes:
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      healthcheck:
        test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
        timeout: 20s
        retries: 10
